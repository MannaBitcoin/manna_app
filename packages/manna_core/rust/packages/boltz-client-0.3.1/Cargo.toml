[package]
edition = "2021"
name = "boltz-client"
version = "0.3.1"
authors = [
    "i5hi <ishi@satoshiportal.com>",
    "Rajarshi Maitra <raj@bitshala.org>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "a boltz exchange client for swaps between BTC/LBTC & LN"
readme = "README.md"
license = "MIT"

[features]
default = ["esplora"]
electrum = ["dep:electrum-client"]
esplora = []
lnurl = ["dep:lnurl-rs"]
regtest = []
ws = [
    "tokio/sync",
    "tokio/rt",
    "tokio/macros",
    "dep:tokio-tungstenite-wasm",
]

[lib]
name = "boltz_client"
crate-type = ["lib"]
path = "src/lib.rs"
doctest = false

[[test]]
name = "mod"
path = "tests/mod.rs"

[[test]]
name = "txs"
path = "tests/txs.rs"

[[test]]
name = "utils"
path = "tests/utils.rs"

[dependencies.async-trait]
version = "0.1.86"

[dependencies.bip39]
version = "2.0.0"

[dependencies.bip85_extended]
version = "1.1.0"

[dependencies.bitcoin]
version = "0.32.2"
features = [
    "rand",
    "base64",
    "rand-std",
]

[dependencies.elements]
version = "0.25.0"
features = ["serde"]

[dependencies.env_logger]
version = "0.7"

[dependencies.futures-util]
version = "0.3.31"

[dependencies.hex]
version = "0.4"

[dependencies.lightning-invoice]
version = "0.32.0"

[dependencies.lnurl-rs]
version = "0.9.0"
features = [
    "async",
    "async-https",
]
optional = true
default-features = false

[dependencies.log]
version = "^0.4"

[dependencies.macros]
version = "1.0.0"
package = "boltz-client-macros"

[dependencies.reqwest]
version = "0.12.12"
features = [
    "json",
    "rustls-tls",
]
default-features = false

[dependencies.secp256k1_musig]
version = "0.32.0-beta.0"
package = "secp256k1"

[dependencies.serde]
version = "1.0.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.0"

[dependencies.tokio]
version = "1.43.0"
features = ["time"]

[dependencies.tokio-tungstenite-wasm]
version = "0.6.0"
features = ["rustls-tls-webpki-roots"]
optional = true

[dependencies.url]
version = "2.5.0"

[dev-dependencies.anyhow]
version = "1.0.100"

[dev-dependencies.serial_test]
version = "3.2.0"

[dev-dependencies.tokio]
version = "1.43.0"
features = [
    "rt",
    "macros",
]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.getrandom]
version = "0.2"
features = ["js"]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.gloo-timers]
version = "0.3.0"
features = ["futures"]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.js-sys]
version = "0.3.77"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.wasm-bindgen-futures]
version = "0.4.50"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.web-sys]
version = "0.3.77"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies.futures]
version = "0.3.31"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies.wasm-bindgen]
version = "0.2.100"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3.50"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies.electrum-client]
version = "0.21.0"
features = [
    "use-rustls-ring",
    "proxy",
]
optional = true
default-features = false

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies.bitcoind]
version = "0.36.0"
features = ["25_0"]

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies.elementsd]
version = "0.11.0"
features = ["22_1_1"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
